# vim:ft=kitty
## name:   Graphite
## author: azur3x
## blurb:  Zero-chroma neutral base with equal-lightness muted accents
##         (OKLCH L=0.72/0.80, C≈0.08). Background carries no hue, so it
##         sits cleanly against any wallpaper.

# ── Base ──
background            #141414
foreground            #d5d4d0
selection_background  #2a3744
selection_foreground  none
cursor                #d5d4d0
cursor_text_color     #141414
url_color             #8fc4f1

# ── Borders / tabs ──
active_border_color     #7daad1
inactive_border_color   #262626
bell_border_color       #d0938d
tab_bar_background      #141414
active_tab_background   #7daad1
active_tab_foreground   #141414
inactive_tab_background #1e1e1e
inactive_tab_foreground #747474

# ── Black ──
color0  #262626
color8  #747474
# ── Red ──
color1  #d0938d
color9  #f0a9a2
# ── Green ──
color2  #87b188
color10 #9ccd9c
# ── Yellow ──
color3  #baa16e
color11 #d7ba7d
# ── Blue ──
color4  #7daad1
color12 #8fc4f1
# ── Magenta ──
color5  #ba96c2
color13 #d7ace0
# ── Cyan ──
color6  #68b4b3
color14 #77cfcf
# ── White ──
color7  #bfbeba
color15 #ecebe7
