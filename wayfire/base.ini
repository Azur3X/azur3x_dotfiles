# Shared Wayfire config — both machines.
# Host-specific values live in hosts/<host>.ini and override keys here.
# Build with: python ~/Documents/azur3x_dotfiles/wayfire/build.py

# ── Core ──────────────────────────────────────────────────────────────
[core]
plugins = \
  animate \
  autostart \
  command \
  cube \
  expo \
  fisheye \
  foreign-toplevel \
  grid \
  gtk-shell \
  idle \
  input-method-v1 \
  invert \
  move \
  oswitch \
  pixdecor \
  place \
  resize \
  scale \
  session-lock \
  shortcuts-inhibit \
  switcher \
  vswipe \
  vswitch \
  wayfire-shell \
  window-rules \
  wm-actions \
  workarounds \
  wrot \
  wsets \
  zoom

close_top_view = <super> KEY_Q | <alt> KEY_F4
vwidth = 3
vheight = 3
preferred_decoration_mode = client
xwayland = true

[input]
xkb_layout = dk

# ── Autostart ─────────────────────────────────────────────────────────
[autostart]
0_env = dbus-update-activation-environment --systemd WAYLAND_DISPLAY DISPLAY XAUTHORITY XDG_CURRENT_DESKTOP
1_session = systemctl --user start graphical-session.target
autostart_wf_shell = false
background = swaybg -m fill -i @DOTFILES@/walls/valley.jpg
bar = waybar
notifications = mako
eww = eww daemon
eww_fixed = @HOME@/.config/eww/script/eww_fixed.sh
idle = swayidle before-sleep swaylock
polkit = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
portal = /usr/lib/xdg-desktop-portal
nextcloud = nextcloud --background

# ── Commands ──────────────────────────────────────────────────────────
[command]
binding_terminal = <super> KEY_T
command_terminal = kitty

binding_launcher = <super> KEY_D
command_launcher = rofi -show drun

binding_action_center = <super> KEY_A
command_action_center = if [ ! -f /tmp/eww_ex.lock ]; then touch /tmp/eww_ex.lock; eww active-windows | grep -q "example" && eww close example media-player || eww open-many example media-player; sleep 0.2; rm /tmp/eww_ex.lock; fi

binding_lock = <super> <shift> KEY_ESC
command_lock = swaylock

binding_logout = <super> KEY_ESC
command_logout = wlogout -b 5

binding_power = KEY_POWER
command_power = wlogout -b 5

binding_screenshot = <super> <shift> KEY_F
command_screenshot = grim - | wl-copy
binding_screenshot_interactive = <super> <shift> KEY_S
command_screenshot_interactive = slurp | grim -g - - | wl-copy
binding_screenshot_file = KEY_PRINT
command_screenshot_file = mkdir -p ~/Pictures/Screenshots && grim ~/Pictures/Screenshots/screenshot_$(date +%Y%m%d_%H%M%S).png

repeatable_binding_volume_up = KEY_VOLUMEUP
command_volume_up = pactl set-sink-volume @DEFAULT_SINK@ +5%
repeatable_binding_volume_down = KEY_VOLUMEDOWN
command_volume_down = pactl set-sink-volume @DEFAULT_SINK@ -5%
binding_mute = KEY_MUTE
command_mute = pactl set-sink-mute @DEFAULT_SINK@ toggle

# ── Windows ───────────────────────────────────────────────────────────
[wm-actions]
toggle_fullscreen = <super> KEY_F
toggle_maximize = <super> KEY_M
minimize = <super> KEY_H
toggle_always_on_top = <super> KEY_X

[move]
activate = <super> BTN_LEFT

[resize]
activate = <super> BTN_RIGHT

[wrot]
activate = <super> <ctrl> BTN_RIGHT

[zoom]
modifier = <super>

[grid]
slot_bl = <super> KEY_KP1 | <super> <shift> KEY_DOWN
slot_b = <super> KEY_KP2
slot_br = <super> KEY_KP3 | <super> <shift> KEY_RIGHT
slot_l = <super> KEY_LEFT | <super> KEY_KP4
slot_c = <super> KEY_UP | <super> KEY_KP5
slot_r = <super> KEY_RIGHT | <super> KEY_KP6
slot_tl = <super> KEY_KP7 | <super> <shift> KEY_LEFT
slot_t = <super> KEY_KP8
slot_tr = <super> KEY_KP9 | <super> <shift> KEY_UP
restore = <super> KEY_DOWN | <super> KEY_KP0

[switcher]
next_view = <alt> KEY_TAB
prev_view = <alt> <shift> KEY_TAB
view_thumbnail_size = 0.3
touch_sensitivity = 1.0

[scale]
toggle = <super> KEY_W

[fisheye]
toggle = <super> <ctrl> KEY_F
radius = 200
zoom = 7

[invert]
toggle = <super> KEY_I

[animate]
open_animation = zoom
close_animation = zoom
minimize_animation = zoom
duration = 250

# ── Workspaces and outputs ────────────────────────────────────────────
[vswitch]
binding_left = <ctrl> <super> KEY_LEFT
binding_down = <ctrl> <super> KEY_DOWN
binding_up = <ctrl> <super> KEY_UP
binding_right = <ctrl> <super> KEY_RIGHT
with_win_left = <ctrl> <super> <shift> KEY_LEFT
with_win_down = <ctrl> <super> <shift> KEY_DOWN
with_win_up = <ctrl> <super> <shift> KEY_UP
with_win_right = <ctrl> <super> <shift> KEY_RIGHT

[expo]
toggle = <super> KEY_E | <super> KEY_TAB
select_workspace_1 = KEY_1
select_workspace_2 = KEY_2
select_workspace_3 = KEY_3
select_workspace_4 = KEY_4
select_workspace_5 = KEY_5
select_workspace_6 = KEY_6
select_workspace_7 = KEY_7
select_workspace_8 = KEY_8
select_workspace_9 = KEY_9

[cube]
activate = <ctrl> <alt> BTN_LEFT

[oswitch]
next_output = <super> KEY_O
next_output_with_win = <super> <shift> KEY_O

[wayfire-shell]
toggle_menu = <super>

# ── Decoration (Graphite) ─────────────────────────────────────────────
[pixdecor]
titlebar = false
title_height = 28
title_font = JetBrainsMono Nerd Font Bold 10
title_text_align = 1
border_size = 0
overlay_engine = rounded_corners
rounded_corner_radius = 7
fg_color = \#1E1E1EFF
bg_color = \#141414FF
fg_text_color = \#D5D4D0FF
bg_text_color = \#747474FF
button_color = \#D5D4D0FF
button_layout = minimize maximize close
button_spacing = 5
button_close_image = @HOME@/.config/wayfire/close.png
button_maximize_image = @HOME@/.config/wayfire/maximize.png
button_minimize_image = @HOME@/.config/wayfire/minimize.png
effect_type = none
animate = false
enable_shade = false
maximized_borders = false
maximized_shadows = false
shadow_color = \#00000040
shadow_radius = 0
