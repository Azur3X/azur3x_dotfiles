# XPS 15 9530 — only what differs from base.ini.

[output:eDP-1]
position = 1920,0

[output:DP-3]
position = 0,0

[input]
natural_scroll = true
tap_to_click = true
disable_touchpad_while_typing = true
touchpad_cursor_speed = 0.2

[autostart]
bluetooth = blueman-applet
brightness = brightnessctl set 80%

[command]
repeatable_binding_bright_up = KEY_BRIGHTNESSUP
command_bright_up = brightnessctl set +5%
repeatable_binding_bright_down = KEY_BRIGHTNESSDOWN
command_bright_down = brightnessctl set 5%-

[vswipe]
fingers = 3
delta_threshold = 24
speed_factor = 256
enable_free_movement = true
enable_smooth_transition = true
